<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roman - Number Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

    <body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-6 gap-8">
    
        <div class="text-center">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">
            Roman - Number Converter
        </h1>
        <p class="text-gray-600">
            Convert Roman numerals to numbers and vice versa
        </p>
        </div>

        <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Roman to Number -->
        <div class="bg-white rounded-xl shadow-md p-6 flex flex-col gap-4">
            <h2 class="text-xl font-bold text-blue-600 text-center md:text-left">
            Roman → Number
            </h2>

            <div class="flex flex-col gap-2">
            <label for="romanInput" class="font-medium">Enter Roman Numeral:</label>
            <input
                type="text"
                id="romanInput"
                placeholder="Ex: XIV"
                class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 uppercase"
            />
            </div>

            <button
            id="convertToNumberBtn"
            class="w-full bg-blue-500 text-white font-semibold py-2 rounded hover:bg-blue-600 transition-colors"
            >
            Convert to Number
            </button>

            <button
            id="clearRomanBtn"
            class="w-full bg-gray-300 text-gray-800 font-semibold py-2 rounded hover:bg-gray-400 transition-colors"
            >
            Clear
            </button>

            <div class="mt-2 font-semibold text-gray-700">
            Result: <span id="romanToNumberResult" class="text-blue-600">—</span>
            </div>
        </div>

        <!-- Number to Roman -->
        <div class="bg-white rounded-xl shadow-md p-6 flex flex-col gap-4">
            <h2 class="text-xl font-bold text-green-600 text-center md:text-left">
            Number → Roman
            </h2>

            <div class="flex flex-col gap-2">
            <label for="numberInput" class="font-medium"
                >Enter Number (1–3999):</label
            >
            <input
                type="number"
                id="numberInput"
                min="1"
                max="3999"
                placeholder="Ex: 2024"
                class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-400"
            />
            </div>

            <button
            id="convertToRomanBtn"
            class="w-full bg-green-500 text-white font-semibold py-2 rounded hover:bg-green-600 transition-colors"
            >
            Convert to Roman
            </button>

            <button
            id="clearNumberBtn"
            class="w-full bg-gray-300 text-gray-800 font-semibold py-2 rounded hover:bg-gray-400 transition-colors"
            >
            Clear
            </button>

            <div class="mt-2 font-semibold text-gray-700">
            Result: <span id="numberToRomanResult" class="text-green-600">—</span>
            </div>
        </div>
        </div>

        <script>
        // Roman numeral mapping
        const romanMap = {
            M: 1000,
            CM: 900,
            D: 500,
            CD: 400,
            C: 100,
            XC: 90,
            L: 50,
            XL: 40,
            X: 10,
            IX: 9,
            V: 5,
            IV: 4,
            I: 1,
        };

        // Roman → Number conversion
        function romanToNumber(roman) {
            roman = roman.toUpperCase();
            let i = 0,
            result = 0;

            while (i < roman.length) {
            const twoChar = roman.substring(i, i + 2);
            if (romanMap[twoChar]) {
                result += romanMap[twoChar];
                i += 2;
            } else if (romanMap[roman[i]]) {
                result += romanMap[roman[i]];
                i++;
            } else {
                return null; // Invalid Roman numeral
            }
            }
            return result;
        }

        // Number → Roman conversion
        function numberToRoman(num) {
            if (num < 1 || num > 3999) return null;
            let result = "";
            for (let key in romanMap) {
            while (num >= romanMap[key]) {
                result += key;
                num -= romanMap[key];
            }
            }
            return result;
        }

        // Elements
        const romanInput = document.getElementById("romanInput");
        const numberInput = document.getElementById("numberInput");
        const romanToNumberResult = document.getElementById(
            "romanToNumberResult"
        );
        const numberToRomanResult = document.getElementById(
            "numberToRomanResult"
        );

        // Buttons
        const convertToNumberBtn = document.getElementById("convertToNumberBtn");
        const convertToRomanBtn = document.getElementById("convertToRomanBtn");
        const clearRomanBtn = document.getElementById("clearRomanBtn");
        const clearNumberBtn = document.getElementById("clearNumberBtn");

        // Convert Roman → Number
        convertToNumberBtn.addEventListener("click", () => {
            const roman = romanInput.value.trim();
            const result = romanToNumber(roman);
            if (result === null) {
            romanToNumberResult.textContent = "Invalid Roman numeral!";
            romanToNumberResult.classList.add("text-red-500");
            } else {
            romanToNumberResult.textContent = result;
            romanToNumberResult.classList.remove("text-red-500");
            }
        });

        // Convert Number → Roman
        convertToRomanBtn.addEventListener("click", () => {
            const num = parseInt(numberInput.value);
            const result = numberToRoman(num);
            if (result === null) {
            numberToRomanResult.textContent = "Invalid number!";
            numberToRomanResult.classList.add("text-red-500");
            } else {
            numberToRomanResult.textContent = result;
            numberToRomanResult.classList.remove("text-red-500");
            }
        });

        // Clear Buttons
        clearRomanBtn.addEventListener("click", () => {
            romanInput.value = "";
            romanToNumberResult.textContent = "—";
        });

        clearNumberBtn.addEventListener("click", () => {
            numberInput.value = "";
            numberToRomanResult.textContent = "—";
        });
        </script>
    </body>
</html>
