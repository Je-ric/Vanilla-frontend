<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Password & PIN Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-6 gap-8">

  <!-- Password Main Card -->
  <div class="w-full max-w-5xl bg-white rounded-2xl shadow-lg p-6 flex flex-col gap-6">
    <h1 class="text-2xl font-bold text-center md:text-left">Password Generator</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Card 1: Password Options -->
      <div class="bg-gray-50 rounded-xl shadow p-4 flex flex-col gap-4">
        <h2 class="text-xl font-bold text-center md:text-left">Options</h2>
        <div class="flex flex-col gap-2">
          <label for="length" class="font-medium">
            Password Length: <span id="lengthValue">12</span>
          </label>
          <input type="range" id="length" min="4" max="20" value="12"
            class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center gap-1"><input type="checkbox" id="uppercase" checked class="accent-blue-500" /> Uppercase</label>
          <label class="flex items-center gap-1"><input type="checkbox" id="lowercase" checked class="accent-blue-500" /> Lowercase</label>
          <label class="flex items-center gap-1"><input type="checkbox" id="numbers" checked class="accent-blue-500" /> Numbers</label>
          <label class="flex items-center gap-1"><input type="checkbox" id="symbols" checked class="accent-blue-500" /> Symbols</label>
        </div>
      </div>

      <!-- Card 2: Password Actions -->
      <div class="bg-gray-50 rounded-xl shadow p-4 flex flex-col gap-4 justify-center">
        <h2 class="text-xl font-bold text-center md:text-left">Actions</h2>
        <div class="grid grid-cols-2 gap-2">
          <button id="generateBtn" class="w-full bg-blue-500 text-white font-semibold py-2 rounded hover:bg-blue-600 transition-colors">Generate</button>
          <button id="clearBtn" class="w-full bg-gray-300 text-gray-800 font-semibold py-2 rounded hover:bg-gray-400 transition-colors">Clear</button>
        </div>
        <button id="copyBtn" class="w-full bg-green-500 text-white font-semibold py-2 rounded hover:bg-green-600 transition-colors">Copy</button>
      </div>

      <!-- Card 3: Password Output -->
      <div class="bg-gray-50 rounded-xl shadow p-4 flex flex-col gap-4">
        <h2 class="text-xl font-bold text-center md:text-left">Output</h2>
        <input type="text" id="passwordDisplay" readonly placeholder="Your password will appear here"
          class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <div class="w-full h-3 bg-gray-300 rounded">
          <div id="strengthBar" class="h-full w-0 rounded transition-all"></div>
        </div>
        <div id="strengthText" class="font-bold text-gray-700">Strength:</div>
      </div>

    </div>
  </div>

  <!-- PIN Main Card -->
  <div class="w-full max-w-5xl bg-white rounded-2xl shadow-lg p-6 flex flex-col gap-6">
    <h1 class="text-2xl font-bold text-center md:text-left">PIN Generator</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Card 1: PIN Options -->
      <div class="bg-gray-50 rounded-xl shadow p-4 flex flex-col gap-4">
        <h2 class="text-xl font-bold text-center md:text-left">Options</h2>
        <div class="flex flex-col gap-2">
          <label for="pinLength" class="font-medium">
            PIN Length (3-12): <span id="pinLengthValue">4</span>
          </label>
          <input type="range" id="pinLength" min="3" max="12" value="4"
            class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-400" />
        </div>
      </div>

      <!-- Card 2: PIN Output & Actions -->
      <div class="bg-gray-50 rounded-xl shadow p-4 flex flex-col gap-4">
        <h2 class="text-xl font-bold text-center md:text-left">Output</h2>
        <input type="text" id="pinDisplay" readonly placeholder="Your PIN will appear here"
          class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-400" />
        <div class="grid grid-cols-2 gap-2">
          <button id="generatePinBtn" class="w-full bg-purple-500 text-white font-semibold py-2 rounded hover:bg-purple-600 transition-colors">Generate PIN</button>
          <button id="clearPinBtn" class="w-full bg-gray-300 text-gray-800 font-semibold py-2 rounded hover:bg-gray-400 transition-colors">Clear</button>
        </div>
      </div>

    </div>
  </div>

</body>


    <script>
        // Character sets
        var upperCaseLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        var lowerCaseLetters = "abcdefghijklmnopqrstuvwxyz";
        var numbers = "0123456789";
        var symbols = "!@#$%^&*()_+[]{}|;:,.<>?";

        // Password Elements
        var lengthInput = document.getElementById("length");
        var uppercaseCheckbox = document.getElementById("uppercase");
        var lowercaseCheckbox = document.getElementById("lowercase");
        var numbersCheckbox = document.getElementById("numbers");
        var symbolsCheckbox = document.getElementById("symbols");
        var generateBtn = document.getElementById("generateBtn");
        var clearBtn = document.getElementById("clearBtn");
        var copyBtn = document.getElementById("copyBtn");
        var passwordDisplay = document.getElementById("passwordDisplay");
        var strengthDisplay = document.getElementById("strength");

        // PIN Elements
        var pinLengthInput = document.getElementById("pinLength");
        var generatePinBtn = document.getElementById("generatePinBtn");
        var clearPinBtn = document.getElementById("clearPinBtn");
        var pinDisplay = document.getElementById("pinDisplay");

        // Generate password
        function generatePassword() {
            var passwordLength = parseInt(lengthInput.value);
            var selectedChars = "";
            var password = "";

            // add characters, based sa selected options
            if (uppercaseCheckbox.checked) {
                selectedChars += upperCaseLetters;
            }
            if (lowercaseCheckbox.checked) {
                selectedChars += lowerCaseLetters;
            }
            if (numbersCheckbox.checked) {
                selectedChars += numbers;
            }
            if (symbolsCheckbox.checked) {
                selectedChars += symbols;
            }

            if (selectedChars === "") {
                alert("Please select at least one character type!");
                return;
            }

            // determine passwordLength range ganon
            // kukuha ng random char dun sa selectedChars
            // ex. if 6 length, 6 times kukuha ng random char
            //     selectedChars ay upper + lower = "ABC...xyz"
            for (var i = 0; i < passwordLength; i++) {
                var randomIndex = Math.floor(Math.random() * selectedChars.length);
                password += selectedChars[randomIndex];
            }

            passwordDisplay.value = password;
            checkStrength(password);
        }

        // Check password strength
        function checkStrength(password) {
            var strength = "Weak";
            var strengthPercent = 0;
            var barColor = "red";

            var hasUpper = /[A-Z]/.test(password);
            var hasLower = /[a-z]/.test(password);
            var hasNumber = /[0-9]/.test(password);
            var hasSymbol = /[!@#$%^&*()_+\[\]{}|;:,.<>?]/.test(password);

            var typesCount = 0;
            if (hasUpper) typesCount++;
            if (hasLower) typesCount++;
            if (hasNumber) typesCount++;
            if (hasSymbol) typesCount++;

            // Determine strength
            if (password.length >= 12 && typesCount >= 3) {
                strength = "Strong";
                strengthPercent = 100;
                barColor = "green";
            } else if (password.length >= 8 && typesCount >= 2) {
                strength = "Medium";
                strengthPercent = 60;
                barColor = "yellow";
            } else if (password.length > 0) {
                strength = "Weak";
                strengthPercent = 30;
                barColor = "red";
            } else {
                strengthPercent = 0;
            }

            // Update strength bar
            var strengthBar = document.getElementById("strengthBar");
            strengthBar.style.width = strengthPercent + "%";
            strengthBar.style.backgroundColor = barColor;

            // Update text
            var strengthText = document.getElementById("strengthText");
            strengthText.textContent = "Strength: " + strength;
        }

        function copyPassword() {
            if (passwordDisplay.value === "") {
                alert("Nothing to copy!");
                return;
            }
            passwordDisplay.select();
            document.execCommand("copy");
            alert("Password copied!");
        }

        function clearPassword() {
            passwordDisplay.value = "";
            strengthDisplay.textContent = "Strength: ";
        }

        // Event listeners
        generateBtn.addEventListener("click", generatePassword);
        copyBtn.addEventListener("click", copyPassword);
        clearBtn.addEventListener("click", clearPassword);

        // PIN
        function generatePIN() {
            var length = parseInt(pinLengthInput.value);
            if (length < 3 || length > 12) {
                alert("PIN length must be between 3 and 12");
                return;
            }
            var pin = "";
            var digits = "0123456789";
            for (var i = 0; i < length; i++) {
                var randomIndex = Math.floor(Math.random() * digits.length);
                pin += digits[randomIndex];
            }
            pinDisplay.value = pin;
        }

        function clearPIN() {
            pinDisplay.value = "";
        }

        generatePinBtn.addEventListener("click", generatePIN);
        clearPinBtn.addEventListener("click", clearPIN);

        // Slider, display selected value
        var lengthInput = document.getElementById("length");
        var lengthValue = document.getElementById("lengthValue");
        var pinLengthInput = document.getElementById("pinLength");
        var pinLengthValue = document.getElementById("pinLengthValue");

        lengthInput.addEventListener("input", function () {
            lengthValue.textContent = lengthInput.value;
        });

        pinLengthInput.addEventListener("input", function () {
            pinLengthValue.textContent = pinLengthInput.value;
        });


    </script>

</html>
