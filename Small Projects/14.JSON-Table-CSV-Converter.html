<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON ↔ Table / CSV Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-6 gap-6">

  <div class="text-center">
    <h1 class="text-3xl font-bold text-blue-600">JSON ↔ Table / CSV</h1>
    <p class="text-gray-500 mt-1">Convert JSON arrays to a table or CSV, and CSV back to JSON</p>
  </div>

  <!-- Mode Tabs -->
  <div class="flex gap-2">
    <button onclick="switchMode('json2table')" id="tab-json2table" class="tab-btn bg-blue-500 text-white px-4 py-2 rounded-full font-semibold text-sm">JSON → Table</button>
    <button onclick="switchMode('json2csv')"   id="tab-json2csv"   class="tab-btn bg-white text-gray-700 border px-4 py-2 rounded-full font-semibold text-sm hover:bg-gray-100">JSON → CSV</button>
    <button onclick="switchMode('csv2json')"   id="tab-csv2json"   class="tab-btn bg-white text-gray-700 border px-4 py-2 rounded-full font-semibold text-sm hover:bg-gray-100">CSV → JSON</button>
  </div>

  <!-- Input Card -->
  <div class="w-full max-w-4xl bg-white rounded-xl shadow-md p-6 flex flex-col gap-4">

    <div class="flex justify-between items-center">
      <h2 id="inputLabel" class="text-lg font-bold text-gray-700">JSON Input</h2>
      <button onclick="loadSample()" class="text-sm text-blue-500 hover:text-blue-700 font-medium">Load Sample</button>
    </div>

    <textarea id="inputArea" placeholder='Paste JSON array here, e.g. [{"name":"Alice","age":25}]'
      class="w-full h-48 p-3 border border-gray-300 rounded resize-none focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm font-mono"></textarea>

    <div class="flex gap-3">
      <button onclick="convert()" class="flex-1 bg-blue-500 text-white font-semibold py-2 rounded hover:bg-blue-600 transition-colors">Convert</button>
      <button onclick="copyOutput()" class="flex-1 bg-green-500 text-white font-semibold py-2 rounded hover:bg-green-600 transition-colors">Copy Output</button>
      <button onclick="clearAll()" class="flex-1 bg-gray-300 text-gray-800 font-semibold py-2 rounded hover:bg-gray-400 transition-colors">Clear</button>
    </div>

    <div id="errorBox" class="hidden bg-red-50 border border-red-200 rounded-lg p-3 text-red-600 font-medium text-sm"></div>

  </div>

  <!-- Table Output -->
  <div id="tableOutput" class="hidden w-full max-w-4xl bg-white rounded-xl shadow-md p-6 flex flex-col gap-3">
    <div class="flex justify-between items-center">
      <h2 class="text-lg font-bold text-gray-700">Table</h2>
      <span id="rowCount" class="text-sm text-gray-400"></span>
    </div>
    <div class="overflow-x-auto">
      <table id="resultTable" class="w-full text-sm border-collapse"></table>
    </div>
  </div>

  <!-- Text Output (CSV or JSON) -->
  <div id="textOutput" class="hidden w-full max-w-4xl bg-white rounded-xl shadow-md p-6 flex flex-col gap-3">
    <div class="flex justify-between items-center">
      <h2 id="outputLabel" class="text-lg font-bold text-gray-700">Output</h2>
      <button id="downloadBtn" onclick="downloadOutput()" class="text-sm text-blue-500 hover:text-blue-700 font-medium">Download</button>
    </div>
    <textarea id="outputArea" readonly
      class="w-full h-64 p-3 border border-gray-300 rounded resize-none focus:outline-none text-sm font-mono bg-gray-50"></textarea>
    <p id="copyMsg" class="hidden text-green-600 text-sm font-medium text-center">Copied!</p>
  </div>

  <script>
    var currentMode = "json2table";
    var lastOutput  = "";
    var lastExt     = "txt";

    var sampleJSON = '[{"name":"Alice","age":25,"city":"Manila","role":"Developer"},{"name":"Bob","age":30,"city":"Cebu","role":"Designer"},{"name":"Carol","age":28,"city":"Davao","role":"Manager"},{"name":"Dan","age":22,"city":"Quezon City","role":"Intern"}]';
    var sampleCSV  = 'name,age,city,role\nAlice,25,Manila,Developer\nBob,30,Cebu,Designer\nCarol,28,Davao,Manager';

    function switchMode(mode) {
      currentMode = mode;
      var btns = document.querySelectorAll(".tab-btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].className = "tab-btn bg-white text-gray-700 border px-4 py-2 rounded-full font-semibold text-sm hover:bg-gray-100";
      }
      document.getElementById("tab-" + mode).className = "tab-btn bg-blue-500 text-white px-4 py-2 rounded-full font-semibold text-sm";

      if (mode === "csv2json") {
        document.getElementById("inputLabel").textContent = "CSV Input";
        document.getElementById("inputArea").placeholder = "Paste CSV here (first row = headers)";
      } else {
        document.getElementById("inputLabel").textContent = "JSON Input";
        document.getElementById("inputArea").placeholder = 'Paste JSON array here, e.g. [{"name":"Alice","age":25}]';
      }

      clearAll();
    }

    function loadSample() {
      if (currentMode === "csv2json") {
        document.getElementById("inputArea").value = sampleCSV;
      } else {
        document.getElementById("inputArea").value = sampleJSON;
      }
    }

    // ── Convert ───────────────────────────────────────────────────────────────
    function convert() {
      var errorBox = document.getElementById("errorBox");
      errorBox.classList.add("hidden");
      document.getElementById("tableOutput").classList.add("hidden");
      document.getElementById("textOutput").classList.add("hidden");

      var input = document.getElementById("inputArea").value.trim();
      if (input === "") {
        errorBox.textContent = "Please enter some input.";
        errorBox.classList.remove("hidden");
        return;
      }

      if (currentMode === "json2table") {
        convertJSONtoTable(input);
      } else if (currentMode === "json2csv") {
        convertJSONtoCSV(input);
      } else if (currentMode === "csv2json") {
        convertCSVtoJSON(input);
      }
    }

    // ── JSON → Table ──────────────────────────────────────────────────────────
    function convertJSONtoTable(input) {
      var errorBox = document.getElementById("errorBox");
      var data;

      try {
        data = JSON.parse(input);
      } catch (e) {
        errorBox.textContent = "Invalid JSON: " + e.message;
        errorBox.classList.remove("hidden");
        return;
      }

      if (!Array.isArray(data)) {
        errorBox.textContent = "JSON must be an array of objects.";
        errorBox.classList.remove("hidden");
        return;
      }

      if (data.length === 0) {
        errorBox.textContent = "JSON array is empty.";
        errorBox.classList.remove("hidden");
        return;
      }

      // Collect all keys
      var keys = [];
      for (var i = 0; i < data.length; i++) {
        var row = data[i];
        for (var key in row) {
          var found = false;
          for (var k = 0; k < keys.length; k++) {
            if (keys[k] === key) { found = true; break; }
          }
          if (!found) { keys.push(key); }
        }
      }

      var table = document.getElementById("resultTable");
      table.innerHTML = "";

      // Header
      var thead = document.createElement("thead");
      var headerRow = document.createElement("tr");
      headerRow.className = "bg-blue-500 text-white";

      // Row number header
      var thNum = document.createElement("th");
      thNum.className = "p-2 border border-blue-400 text-left font-semibold text-xs";
      thNum.textContent = "#";
      headerRow.appendChild(thNum);

      for (var k = 0; k < keys.length; k++) {
        var th = document.createElement("th");
        th.className = "p-2 border border-blue-400 text-left font-semibold text-xs whitespace-nowrap";
        th.textContent = keys[k];
        headerRow.appendChild(th);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      // Body
      var tbody = document.createElement("tbody");
      for (var i = 0; i < data.length; i++) {
        var tr = document.createElement("tr");
        if (i % 2 === 0) {
          tr.className = "bg-white hover:bg-blue-50";
        } else {
          tr.className = "bg-gray-50 hover:bg-blue-50";
        }

        // Row number
        var tdNum = document.createElement("td");
        tdNum.className = "p-2 border border-gray-200 text-gray-400 text-xs";
        tdNum.textContent = i + 1;
        tr.appendChild(tdNum);

        for (var k = 0; k < keys.length; k++) {
          var td = document.createElement("td");
          td.className = "p-2 border border-gray-200 text-sm text-gray-700";
          var val = data[i][keys[k]];
          if (val === undefined || val === null) {
            td.textContent = "";
            td.className += " text-gray-300";
          } else {
            td.textContent = val;
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);

      document.getElementById("rowCount").textContent = data.length + " rows, " + keys.length + " columns";
      document.getElementById("tableOutput").classList.remove("hidden");
    }

    // ── JSON → CSV ────────────────────────────────────────────────────────────
    function convertJSONtoCSV(input) {
      var errorBox = document.getElementById("errorBox");
      var data;

      try {
        data = JSON.parse(input);
      } catch (e) {
        errorBox.textContent = "Invalid JSON: " + e.message;
        errorBox.classList.remove("hidden");
        return;
      }

      if (!Array.isArray(data) || data.length === 0) {
        errorBox.textContent = "JSON must be a non-empty array of objects.";
        errorBox.classList.remove("hidden");
        return;
      }

      var keys = [];
      for (var i = 0; i < data.length; i++) {
        for (var key in data[i]) {
          var found = false;
          for (var k = 0; k < keys.length; k++) {
            if (keys[k] === key) { found = true; break; }
          }
          if (!found) { keys.push(key); }
        }
      }

      var csv = keys.join(",") + "\n";
      for (var i = 0; i < data.length; i++) {
        var rowParts = [];
        for (var k = 0; k < keys.length; k++) {
          var val = data[i][keys[k]];
          if (val === undefined || val === null) {
            rowParts.push("");
          } else {
            var str = "" + val;
            // Wrap in quotes if contains comma, quote, or newline
            if (str.indexOf(",") !== -1 || str.indexOf('"') !== -1 || str.indexOf("\n") !== -1) {
              str = '"' + str.replace(/"/g, '""') + '"';
            }
            rowParts.push(str);
          }
        }
        csv += rowParts.join(",") + "\n";
      }

      lastOutput = csv;
      lastExt    = "csv";
      document.getElementById("outputLabel").textContent = "CSV Output";
      document.getElementById("outputArea").value = csv;
      document.getElementById("textOutput").classList.remove("hidden");
    }

    // ── CSV → JSON ────────────────────────────────────────────────────────────
    function convertCSVtoJSON(input) {
      var errorBox = document.getElementById("errorBox");
      var lines = input.split("\n");

      // Remove empty trailing lines
      while (lines.length > 0 && lines[lines.length - 1].trim() === "") {
        lines.pop();
      }

      if (lines.length < 2) {
        errorBox.textContent = "CSV must have at least a header row and one data row.";
        errorBox.classList.remove("hidden");
        return;
      }

      var headers = parseCSVLine(lines[0]);
      var result  = [];

      for (var i = 1; i < lines.length; i++) {
        if (lines[i].trim() === "") { continue; }
        var values = parseCSVLine(lines[i]);
        var obj    = {};
        for (var k = 0; k < headers.length; k++) {
          if (k < values.length) {
            obj[headers[k]] = values[k];
          } else {
            obj[headers[k]] = "";
          }
        }
        result.push(obj);
      }

      var json = JSON.stringify(result, null, 2);
      lastOutput = json;
      lastExt    = "json";
      document.getElementById("outputLabel").textContent = "JSON Output";
      document.getElementById("outputArea").value = json;
      document.getElementById("textOutput").classList.remove("hidden");
    }

    // ── Parse a single CSV line (handles quoted fields) ───────────────────────
    function parseCSVLine(line) {
      var fields = [];
      var current = "";
      var inQuotes = false;

      for (var i = 0; i < line.length; i++) {
        var ch = line[i];
        if (inQuotes) {
          if (ch === '"') {
            if (i + 1 < line.length && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            current += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ",") {
            fields.push(current.trim());
            current = "";
          } else {
            current += ch;
          }
        }
      }
      fields.push(current.trim());
      return fields;
    }

    function copyOutput() {
      var area = document.getElementById("outputArea");
      var msg  = document.getElementById("copyMsg");
      if (area.value === "") { return; }
      area.select();
      document.execCommand("copy");
      msg.classList.remove("hidden");
      setTimeout(function() { msg.classList.add("hidden"); }, 2000);
    }

    function downloadOutput() {
      var blob = new Blob([lastOutput], { type: "text/plain" });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement("a");
      a.href     = url;
      a.download = "output." + lastExt;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearAll() {
      document.getElementById("inputArea").value = "";
      document.getElementById("outputArea").value = "";
      document.getElementById("errorBox").classList.add("hidden");
      document.getElementById("tableOutput").classList.add("hidden");
      document.getElementById("textOutput").classList.add("hidden");
      document.getElementById("copyMsg").classList.add("hidden");
      lastOutput = "";
    }
  </script>

</body>
</html>
