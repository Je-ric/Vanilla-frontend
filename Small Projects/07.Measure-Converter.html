<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Measure Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-6 gap-6">

  <div class="text-center">
    <h1 class="text-3xl font-bold text-blue-600">Measure Converter</h1>
    <p class="text-gray-500 mt-1">Convert between common units of measurement</p>
  </div>

  <!-- Category Tabs -->
  <div class="flex flex-wrap justify-center gap-2">
    <button onclick="switchCategory('length')"   id="tab-length"   class="tab-btn bg-blue-500 text-white px-4 py-2 rounded-full font-semibold text-sm transition">Length</button>
    <button onclick="switchCategory('weight')"   id="tab-weight"   class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-full font-semibold text-sm border transition hover:bg-gray-200">Weight</button>
    <button onclick="switchCategory('temp')"     id="tab-temp"     class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-full font-semibold text-sm border transition hover:bg-gray-200">Temperature</button>
    <button onclick="switchCategory('area')"     id="tab-area"     class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-full font-semibold text-sm border transition hover:bg-gray-200">Area</button>
    <button onclick="switchCategory('volume')"   id="tab-volume"   class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-full font-semibold text-sm border transition hover:bg-gray-200">Volume</button>
    <button onclick="switchCategory('speed')"    id="tab-speed"    class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-full font-semibold text-sm border transition hover:bg-gray-200">Speed</button>
    <button onclick="switchCategory('time')"     id="tab-time"     class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-full font-semibold text-sm border transition hover:bg-gray-200">Time</button>
    <button onclick="switchCategory('data')"     id="tab-data"     class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-full font-semibold text-sm border transition hover:bg-gray-200">Data</button>
  </div>

  <!-- Converter Card -->
  <div class="w-full max-w-2xl bg-white rounded-xl shadow-md p-6 flex flex-col gap-5">

    <h2 id="category-title" class="text-xl font-bold text-blue-600">Length</h2>

    <div class="flex flex-col gap-2">
      <label class="font-medium">Value</label>
      <input type="number" id="inputValue" placeholder="Enter value"
        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-2">
        <label class="font-medium">From</label>
        <select id="fromUnit" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"></select>
      </div>
      <div class="flex flex-col gap-2">
        <label class="font-medium">To</label>
        <select id="toUnit" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"></select>
      </div>
    </div>

    <div class="flex gap-3">
      <button onclick="convert()" class="flex-1 bg-blue-500 text-white font-semibold py-2 rounded hover:bg-blue-600 transition-colors">Convert</button>
      <button onclick="swapUnits()" class="flex-1 bg-gray-200 text-gray-800 font-semibold py-2 rounded hover:bg-gray-300 transition-colors">⇄ Swap</button>
      <button onclick="clearAll()" class="flex-1 bg-gray-300 text-gray-800 font-semibold py-2 rounded hover:bg-gray-400 transition-colors">Clear</button>
    </div>

    <div id="resultBox" class="hidden bg-blue-50 border border-blue-200 rounded-lg p-4 text-center">
      <p class="text-gray-500 text-sm">Result</p>
      <p id="resultText" class="text-2xl font-bold text-blue-600 mt-1">—</p>
    </div>

    <div id="errorBox" class="hidden bg-red-50 border border-red-200 rounded-lg p-3 text-center text-red-600 font-medium"></div>

  </div>

  <!-- Reference Table -->
  <div class="w-full max-w-2xl bg-white rounded-xl shadow-md p-6">
    <h2 class="text-lg font-bold text-gray-700 mb-3">Quick Reference</h2>
    <div id="referenceTable" class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-sm text-gray-600"></div>
  </div>

  <script>
    // ── Unit definitions ──────────────────────────────────────────────────────
    // All values are conversion factors TO the base unit of each category.
    // Temperature is handled separately with if/else formulas.

    var categories = {
      length: {
        title: "Length",
        base: "meter",
        units: {
          millimeter:  0.001,
          centimeter:  0.01,
          meter:       1,
          kilometer:   1000,
          inch:        0.0254,
          foot:        0.3048,
          yard:        0.9144,
          mile:        1609.344,
          "nautical mile": 1852
        }
      },
      weight: {
        title: "Weight / Mass",
        base: "kilogram",
        units: {
          milligram:   0.000001,
          gram:        0.001,
          kilogram:    1,
          "metric ton": 1000,
          ounce:       0.0283495,
          pound:       0.453592,
          stone:       6.35029
        }
      },
      temp: {
        title: "Temperature",
        base: null,
        units: { Celsius: 1, Fahrenheit: 1, Kelvin: 1 }
      },
      area: {
        title: "Area",
        base: "sq meter",
        units: {
          "sq millimeter": 0.000001,
          "sq centimeter": 0.0001,
          "sq meter":      1,
          "sq kilometer":  1000000,
          "sq inch":       0.00064516,
          "sq foot":       0.092903,
          "sq yard":       0.836127,
          acre:            4046.86,
          hectare:         10000
        }
      },
      volume: {
        title: "Volume",
        base: "liter",
        units: {
          milliliter:  0.001,
          liter:       1,
          "cubic meter": 1000,
          "cubic inch":  0.0163871,
          "cubic foot":  28.3168,
          "US gallon":   3.78541,
          "US quart":    0.946353,
          "US pint":     0.473176,
          "US cup":      0.236588,
          "US fl oz":    0.0295735,
          tablespoon:    0.0147868,
          teaspoon:      0.00492892
        }
      },
      speed: {
        title: "Speed",
        base: "m/s",
        units: {
          "m/s":   1,
          "km/h":  0.277778,
          "mph":   0.44704,
          "knot":  0.514444,
          "ft/s":  0.3048
        }
      },
      time: {
        title: "Time",
        base: "second",
        units: {
          millisecond: 0.001,
          second:      1,
          minute:      60,
          hour:        3600,
          day:         86400,
          week:        604800,
          month:       2629800,
          year:        31557600
        }
      },
      data: {
        title: "Digital Data",
        base: "byte",
        units: {
          bit:      0.125,
          byte:     1,
          kilobyte: 1024,
          megabyte: 1048576,
          gigabyte: 1073741824,
          terabyte: 1099511627776,
          petabyte: 1125899906842624
        }
      }
    };

    var currentCategory = "length";

    // ── Switch category ───────────────────────────────────────────────────────
    function switchCategory(cat) {
      currentCategory = cat;

      // Update tab styles
      var tabs = document.querySelectorAll(".tab-btn");
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].className = "tab-btn bg-white text-gray-700 px-4 py-2 rounded-full font-semibold text-sm border transition hover:bg-gray-200";
      }
      document.getElementById("tab-" + cat).className = "tab-btn bg-blue-500 text-white px-4 py-2 rounded-full font-semibold text-sm transition";

      // Update title
      document.getElementById("category-title").textContent = categories[cat].title;

      // Populate selects
      populateSelects(cat);

      // Hide result/error
      document.getElementById("resultBox").classList.add("hidden");
      document.getElementById("errorBox").classList.add("hidden");
      document.getElementById("inputValue").value = "";

      // Update reference table
      buildReferenceTable(cat);
    }

    function populateSelects(cat) {
      var fromSel = document.getElementById("fromUnit");
      var toSel   = document.getElementById("toUnit");
      var units   = categories[cat].units;

      fromSel.innerHTML = "";
      toSel.innerHTML   = "";

      var keys = Object.keys(units);
      for (var i = 0; i < keys.length; i++) {
        var opt1 = document.createElement("option");
        opt1.value = keys[i];
        opt1.textContent = keys[i];
        fromSel.appendChild(opt1);

        var opt2 = document.createElement("option");
        opt2.value = keys[i];
        opt2.textContent = keys[i];
        toSel.appendChild(opt2);
      }

      // Default: select second unit for "to"
      if (keys.length > 1) {
        toSel.selectedIndex = 1;
      }
    }

    // ── Convert ───────────────────────────────────────────────────────────────
    function convert() {
      var errorBox  = document.getElementById("errorBox");
      var resultBox = document.getElementById("resultBox");
      var resultText = document.getElementById("resultText");

      errorBox.classList.add("hidden");
      resultBox.classList.add("hidden");

      var inputVal = parseFloat(document.getElementById("inputValue").value);
      var fromUnit = document.getElementById("fromUnit").value;
      var toUnit   = document.getElementById("toUnit").value;

      if (isNaN(inputVal)) {
        errorBox.textContent = "Please enter a valid number.";
        errorBox.classList.remove("hidden");
        return;
      }

      var result;

      if (currentCategory === "temp") {
        result = convertTemperature(inputVal, fromUnit, toUnit);
        if (result === null) {
          errorBox.textContent = "Invalid temperature conversion.";
          errorBox.classList.remove("hidden");
          return;
        }
      } else {
        var units = categories[currentCategory].units;
        // Convert from → base → to
        var inBase = inputVal * units[fromUnit];
        result = inBase / units[toUnit];
      }

      // Format result
      var formatted;
      if (result === 0) {
        formatted = "0";
      } else if (Math.abs(result) >= 0.0001 && Math.abs(result) < 1e12) {
        formatted = parseFloat(result.toPrecision(8)).toString();
      } else {
        formatted = result.toExponential(4);
      }

      resultText.textContent = inputVal + " " + fromUnit + " = " + formatted + " " + toUnit;
      resultBox.classList.remove("hidden");
    }

    // ── Temperature (if/else formulas) ────────────────────────────────────────
    function convertTemperature(val, from, to) {
      var celsius;

      // Step 1: convert to Celsius
      if (from === "Celsius") {
        celsius = val;
      } else if (from === "Fahrenheit") {
        celsius = (val - 32) * 5 / 9;
      } else if (from === "Kelvin") {
        celsius = val - 273.15;
      } else {
        return null;
      }

      // Step 2: convert Celsius to target
      if (to === "Celsius") {
        return celsius;
      } else if (to === "Fahrenheit") {
        return celsius * 9 / 5 + 32;
      } else if (to === "Kelvin") {
        return celsius + 273.15;
      } else {
        return null;
      }
    }

    // ── Swap ──────────────────────────────────────────────────────────────────
    function swapUnits() {
      var fromSel = document.getElementById("fromUnit");
      var toSel   = document.getElementById("toUnit");
      var temp    = fromSel.value;
      fromSel.value = toSel.value;
      toSel.value   = temp;
    }

    function clearAll() {
      document.getElementById("inputValue").value = "";
      document.getElementById("resultBox").classList.add("hidden");
      document.getElementById("errorBox").classList.add("hidden");
    }

    // ── Reference table ───────────────────────────────────────────────────────
    function buildReferenceTable(cat) {
      var container = document.getElementById("referenceTable");
      container.innerHTML = "";

      if (cat === "temp") {
        var refs = [
          "0°C = 32°F = 273.15K",
          "100°C = 212°F = 373.15K",
          "-40°C = -40°F",
          "37°C = 98.6°F (body)",
          "20°C = 68°F (room)",
          "-273.15°C = 0K (abs. zero)"
        ];
        for (var i = 0; i < refs.length; i++) {
          var div = document.createElement("div");
          div.className = "bg-gray-50 rounded p-2 text-center";
          div.textContent = refs[i];
          container.appendChild(div);
        }
        return;
      }

      var units = categories[cat].units;
      var base  = categories[cat].base;
      var keys  = Object.keys(units);

      for (var j = 0; j < keys.length; j++) {
        var key = keys[j];
        if (key === base) continue;
        var factor = units[key];
        var display;

        if (factor >= 1) {
          display = "1 " + base + " = " + (1 / factor).toPrecision(4) + " " + key;
        } else {
          display = "1 " + key + " = " + factor.toPrecision(4) + " " + base;
        }

        var div = document.createElement("div");
        div.className = "bg-gray-50 rounded p-2 text-center";
        div.textContent = display;
        container.appendChild(div);
      }
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    switchCategory("length");

    // Allow Enter key to trigger convert
    document.getElementById("inputValue").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { convert(); }
    });
  </script>

</body>
</html>
