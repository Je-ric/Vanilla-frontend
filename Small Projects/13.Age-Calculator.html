<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Age Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-6 gap-6">

  <div class="text-center">
    <h1 class="text-3xl font-bold text-blue-600">Age Calculator</h1>
    <p class="text-gray-500 mt-1">Find your exact age in years, months, weeks, and days</p>
  </div>

  <!-- Input Card -->
  <div class="w-full max-w-xl bg-white rounded-xl shadow-md p-6 flex flex-col gap-4">

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <label class="font-medium text-gray-700">Date of Birth</label>
        <input type="date" id="dob"
          class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="font-medium text-gray-700">Calculate Age On</label>
        <input type="date" id="targetDate"
          class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>
    </div>

    <div class="flex gap-3">
      <button onclick="calculate()" class="flex-1 bg-blue-500 text-white font-semibold py-2 rounded hover:bg-blue-600 transition-colors">Calculate</button>
      <button onclick="setToday()" class="flex-1 bg-gray-200 text-gray-800 font-semibold py-2 rounded hover:bg-gray-300 transition-colors">Use Today</button>
      <button onclick="clearAll()" class="flex-1 bg-gray-300 text-gray-800 font-semibold py-2 rounded hover:bg-gray-400 transition-colors">Clear</button>
    </div>

    <div id="errorBox" class="hidden bg-red-50 border border-red-200 rounded-lg p-3 text-center text-red-600 font-medium text-sm"></div>

  </div>

  <!-- Results Card -->
  <div id="resultsCard" class="hidden w-full max-w-xl bg-white rounded-xl shadow-md p-6 flex flex-col gap-5">

    <!-- Main age -->
    <div class="text-center bg-blue-50 rounded-xl p-5">
      <p class="text-gray-500 text-sm mb-1">Your Age</p>
      <p id="mainAge" class="text-4xl font-bold text-blue-600"></p>
      <p id="nextBirthday" class="text-sm text-gray-400 mt-2"></p>
    </div>

    <!-- Breakdown grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
      <div class="bg-gray-50 rounded-xl p-3">
        <p id="totalYears" class="text-2xl font-bold text-blue-600">—</p>
        <p class="text-xs text-gray-500 mt-1">Years</p>
      </div>
      <div class="bg-gray-50 rounded-xl p-3">
        <p id="totalMonths" class="text-2xl font-bold text-green-600">—</p>
        <p class="text-xs text-gray-500 mt-1">Total Months</p>
      </div>
      <div class="bg-gray-50 rounded-xl p-3">
        <p id="totalWeeks" class="text-2xl font-bold text-purple-600">—</p>
        <p class="text-xs text-gray-500 mt-1">Total Weeks</p>
      </div>
      <div class="bg-gray-50 rounded-xl p-3">
        <p id="totalDays" class="text-2xl font-bold text-orange-500">—</p>
        <p class="text-xs text-gray-500 mt-1">Total Days</p>
      </div>
    </div>

    <!-- Extra stats -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
      <div class="bg-gray-50 rounded-xl p-3">
        <p id="totalHours" class="text-lg font-bold text-teal-600">—</p>
        <p class="text-xs text-gray-500 mt-1">Total Hours</p>
      </div>
      <div class="bg-gray-50 rounded-xl p-3">
        <p id="totalMinutes" class="text-lg font-bold text-pink-500">—</p>
        <p class="text-xs text-gray-500 mt-1">Total Minutes</p>
      </div>
      <div class="bg-gray-50 rounded-xl p-3">
        <p id="dayOfWeek" class="text-lg font-bold text-indigo-500">—</p>
        <p class="text-xs text-gray-500 mt-1">Born on</p>
      </div>
    </div>

  </div>

  <script>
    var dayNames   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    // ── Set today as target ───────────────────────────────────────────────────
    function setToday() {
      var today = new Date();
      var y = today.getFullYear();
      var m = today.getMonth() + 1;
      var d = today.getDate();
      var mm = m < 10 ? "0" + m : "" + m;
      var dd = d < 10 ? "0" + d : "" + d;
      document.getElementById("targetDate").value = y + "-" + mm + "-" + dd;
    }

    // ── Days in month (if/else) ───────────────────────────────────────────────
    function daysInMonth(month, year) {
      if (month === 2) {
        if (year % 400 === 0) {
          return 29;
        } else if (year % 100 === 0) {
          return 28;
        } else if (year % 4 === 0) {
          return 29;
        } else {
          return 28;
        }
      } else if (month === 4 || month === 6 || month === 9 || month === 11) {
        return 30;
      } else {
        return 31;
      }
    }

    // ── Calculate ─────────────────────────────────────────────────────────────
    function calculate() {
      var errorBox = document.getElementById("errorBox");
      errorBox.classList.add("hidden");

      var dobVal    = document.getElementById("dob").value;
      var targetVal = document.getElementById("targetDate").value;

      if (dobVal === "") {
        errorBox.textContent = "Please enter your date of birth.";
        errorBox.classList.remove("hidden");
        return;
      }

      if (targetVal === "") {
        errorBox.textContent = "Please enter a target date.";
        errorBox.classList.remove("hidden");
        return;
      }

      var dob    = new Date(dobVal);
      var target = new Date(targetVal);

      if (dob > target) {
        errorBox.textContent = "Date of birth cannot be after the target date.";
        errorBox.classList.remove("hidden");
        return;
      }

      var dobY = dob.getFullYear();
      var dobM = dob.getMonth() + 1;
      var dobD = dob.getDate();

      var tarY = target.getFullYear();
      var tarM = target.getMonth() + 1;
      var tarD = target.getDate();

      // ── Exact years, months, days (if/else borrow logic) ──────────────────
      var years  = tarY - dobY;
      var months = tarM - dobM;
      var days   = tarD - dobD;

      if (days < 0) {
        months = months - 1;
        days   = days + daysInMonth(tarM - 1 === 0 ? 12 : tarM - 1, tarM - 1 === 0 ? tarY - 1 : tarY);
      }

      if (months < 0) {
        years  = years - 1;
        months = months + 12;
      }

      // ── Total counts ──────────────────────────────────────────────────────
      var diffMs      = target - dob;
      var totalDays   = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      var totalWeeks  = Math.floor(totalDays / 7);
      var totalMonths = years * 12 + months;
      var totalHours  = totalDays * 24;
      var totalMins   = totalHours * 60;

      // ── Next birthday ─────────────────────────────────────────────────────
      var nextBday = new Date(tarY, dobM - 1, dobD);
      if (nextBday <= target) {
        nextBday = new Date(tarY + 1, dobM - 1, dobD);
      }
      var daysToNext = Math.round((nextBday - target) / (1000 * 60 * 60 * 24));

      // ── Day of week born ──────────────────────────────────────────────────
      var bornDay = dayNames[dob.getDay()];

      // ── Display ───────────────────────────────────────────────────────────
      document.getElementById("mainAge").textContent =
        years + " yrs, " + months + " mos, " + days + " days";

      document.getElementById("nextBirthday").textContent =
        daysToNext === 0
          ? "🎂 Happy Birthday!"
          : "🎂 Next birthday in " + daysToNext + " day" + (daysToNext !== 1 ? "s" : "");

      document.getElementById("totalYears").textContent   = years.toLocaleString();
      document.getElementById("totalMonths").textContent  = totalMonths.toLocaleString();
      document.getElementById("totalWeeks").textContent   = totalWeeks.toLocaleString();
      document.getElementById("totalDays").textContent    = totalDays.toLocaleString();
      document.getElementById("totalHours").textContent   = totalHours.toLocaleString();
      document.getElementById("totalMinutes").textContent = totalMins.toLocaleString();
      document.getElementById("dayOfWeek").textContent    = bornDay;

      document.getElementById("resultsCard").classList.remove("hidden");
    }

    function clearAll() {
      document.getElementById("dob").value         = "";
      document.getElementById("targetDate").value  = "";
      document.getElementById("errorBox").classList.add("hidden");
      document.getElementById("resultsCard").classList.add("hidden");
    }

    // Set today on load
    setToday();
  </script>

</body>
</html>
